name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum -c SHA256SUMS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install 'cryptography>=38'
      - run: python3 -m unittest discover -s tests
      - run: node --test tests/test_ip_progress.mjs tests/test_job_guidance.mjs
      - run: node --check studio/static/vpn.js
      - run: node --check studio/static/browser.js
      - run: node --check studio/static/accounts.js
      - run: bash install-debian.sh --check
      - run: bash tools/install_vpn_helper.sh --check
      - run: bash tools/install_browser.sh --check
